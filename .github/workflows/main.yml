name: Ultimate Minecraft Server (Hugging Face)

on:
  workflow_dispatch: # Manual "Run" button

jobs:
  server:
    runs-on: ubuntu-latest
    # Set the global timezone for the entire Linux Runner to IST
    # This prevents the timezone desync between Playit, Java, and Plugins!
    env:
      TZ: Asia/Kolkata
    permissions:
      actions: write
      contents: read
    
    steps:
      # 1. Setup Environment
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Install Dependencies (Playit, Rclone, JQ)
        run: |
          curl -SsL https://playit-cloud.github.io/ppa/key.gpg | gpg --dearmor | sudo tee /etc/apt/trusted.gpg.d/playit.gpg >/dev/null
          echo "deb [signed-by=/etc/apt/trusted.gpg.d/playit.gpg] https://playit-cloud.github.io/ppa/data ./" | sudo tee /etc/apt/sources.list.d/playit-cloud.list
          sudo apt-get update
          sudo apt-get install playit=0.15.26 jq zip unzip -y
          sudo -v ; curl https://rclone.org/install.sh | sudo bash

      # 2. Connect to Hugging Face
      - name: Configure Hugging Face
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          pip install -q -U huggingface-hub
          hf auth login --token "$HF_TOKEN" --add-to-git-credential 2>/dev/null || true
          echo "✅ Hugging Face Configured! Dataset: $HF_USER/$HF_DATASET"

      # 3. Restore Backup
      - name: 📥 Restore Backup
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          mkdir -p server/minecraft-worlds
          mkdir -p server/plugins
          
          echo "Checking Hugging Face for previous backup..."
          wget -q -O server/backup.zip \
            "https://huggingface.co/datasets/$HF_USER/$HF_DATASET/resolve/main/backup.zip" \
            --header="Authorization: Bearer $HF_TOKEN" || echo "No backup found. Starting Fresh!"
          
          if [ -f server/backup.zip ]; then
            echo "Backup found! Unzipping World & Plugins..."
            unzip -o server/backup.zip -d server/
            rm server/backup.zip
            touch server/BACKUP_WAS_RESTORED
          fi

      # 4. Setup Server Logic (Privacy, Seed & End Portal)
      - name: Configure Server & Folders
        env:
          SEED_SECRET: ${{ secrets.SEED }}
          END_PORTAL: ${{ secrets.END_PORTAL }}
          ANTI_XRAY: ${{ secrets.ANTI_XRAY }}
        run: |
          # --- CREDIT WATERMARK ---
          echo "Code by @GamingBurst007 (Discord/Insta)" > server/author.txt
          echo "settings:" > server/bukkit.yml
          echo "  world-container: minecraft-worlds" >> server/bukkit.yml
          
          echo "commands:" > server/spigot.yml
          echo "  log: false" >> server/spigot.yml
          echo "settings:" >> server/spigot.yml
          echo "  moved-wrongly-threshold: 0.125" >> server/spigot.yml
          echo "  moved-too-quickly-multiplier: 10.0" >> server/spigot.yml
          echo "  timeout-time: 120" >> server/spigot.yml
          echo "  netty-threads: 4" >> server/spigot.yml
          echo "world-settings:" >> server/spigot.yml
          echo "  default:" >> server/spigot.yml
          echo "    seed-endcity: 0" >> server/spigot.yml
          echo "    seed-village: 0" >> server/spigot.yml
          echo "    seed-monument: 0" >> server/spigot.yml
          echo "    seed-slime: 0" >> server/spigot.yml
          
          echo "server-port=25565" > server/server.properties
          echo "online-mode=false" >> server/server.properties
          echo "motd=VoidBerry SMP" >> server/server.properties
          echo "allow-flight=true" >> server/server.properties
          echo "rate-limit=0" >> server/server.properties
          echo "network-compression-threshold=256" >> server/server.properties
          echo "eula=true" > server/eula.txt

          # --- ANTI-XRAY TOGGLE ---
          mkdir -p server/config
          echo "anticheat:" > server/config/paper-world-defaults.yml
          echo "  anti-xray:" >> server/config/paper-world-defaults.yml
          if [ "$ANTI_XRAY" == "false" ]; then
            echo "    enabled: false" >> server/config/paper-world-defaults.yml
          else
            echo "    enabled: true" >> server/config/paper-world-defaults.yml
            echo "    engine-mode: 1" >> server/config/paper-world-defaults.yml
          fi
          
          # --- CONTAINER UPDATE OPTIMIZATION (reduces inventory packet spam) ---
          echo "tick-rates:" >> server/config/paper-world-defaults.yml
          echo "  container-update: 2" >> server/config/paper-world-defaults.yml
          
          # --- VANILLA SEED FIX (Forces exact Vanilla structure generation) ---
          echo "feature-seeds:" >> server/config/paper-world-defaults.yml
          echo "  generate-random-seeds-for-all: false" >> server/config/paper-world-defaults.yml
          
          # --- PAPER GLOBAL NETWORK CONFIG & TNT DUPER ---
          echo "packet-limiter:" > server/config/paper-global.yml
          echo "  all-packets:" >> server/config/paper-global.yml
          echo "    max-packet-rate: 5000.0" >> server/config/paper-global.yml
          echo "    interval: 7.0" >> server/config/paper-global.yml
          echo "unsupported-settings:" >> server/config/paper-global.yml
          echo "  allow-piston-duplication: true" >> server/config/paper-global.yml

          # --- END PORTAL TOGGLE ---
          if [ "$END_PORTAL" == "false" ]; then
            echo "allow-end=false" >> server/server.properties
            echo "  allow-end: false" >> server/bukkit.yml
          else
            echo "allow-end=true" >> server/server.properties
          fi
          
          # --- SEED LOGIC (STRICT ORIGINAL) ---
          if [ ! -f server/BACKUP_WAS_RESTORED ]; then
             if [ -n "$SEED_SECRET" ]; then
                echo "✅ New World Detected! Applying Secret Seed..."
                echo "level-seed=$SEED_SECRET" >> server/server.properties
             fi
          fi

          # --- SERVER LOGO OPTIONAL ---
          if [ -f logo.png ]; then
            echo "✅ Custom logo.png found! Applying as server logo..."
            cp logo.png server/server-icon.png
          fi

          # --- JAVA RESOURCE PACK ---
          if [ -d java-pack ]; then
            JAVA_VP=$(find java-pack -name "*.zip" | head -n 1)
            if [ -n "$JAVA_VP" ]; then
              echo "✅ Java Resource Pack detected: $JAVA_VP"
              PACK_NAME=$(basename "$JAVA_VP")
              PACK_NAME_ENCODED="${PACK_NAME// /%20}"
              PACK_SHA=$(sha1sum "$JAVA_VP" | awk '{print $1}')
              PACK_URL="https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}/java-pack/$PACK_NAME_ENCODED"
              echo "resource-pack=$PACK_URL" >> server/server.properties
              echo "resource-pack-sha1=$PACK_SHA" >> server/server.properties
              echo "require-resource-pack=true" >> server/server.properties
              echo "resource-pack-prompt=Optional Java Resource Pack available! Click Yes to download." >> server/server.properties
            fi
          fi
          
          # --- BEDROCK RESOURCE PACK ---
          if [ -d bedrock-pack ]; then
            mkdir -p server/plugins/Geyser-Spigot/packs
            if ls bedrock-pack/*.mcpack 1> /dev/null 2>&1 || ls bedrock-pack/*.zip 1> /dev/null 2>&1; then
              echo "✅ Bedrock Resource Pack detected! Copying to Geyser..."
              cp bedrock-pack/*.mcpack server/plugins/Geyser-Spigot/packs/ 2>/dev/null || true
              cp bedrock-pack/*.zip server/plugins/Geyser-Spigot/packs/ 2>/dev/null || true
            fi
          fi

      # 5a. Restore Cache
      - name: 🗃️ Restore Paper Jar Cache
        id: cache-paper
        uses: actions/cache/restore@v4
        with:
          path: server/paper.jar
          key: paper-26.1.2-64

      - name: 🗃️ Restore Plugins Cache
        id: cache-plugins
        uses: actions/cache/restore@v4
        with:
          path: server/plugins
          key: plugins-${{ hashFiles('plugins/**') }}-${{ hashFiles('plugins.txt') }}

      # 5b. Download Core & Plugins (Smart Version Check with Cache Fallback)
      - name: Download Paper & Plugins
        run: |
          TARGET_VERSION="26.1.2"
          
          if [ -f server/paper.jar ]; then
            echo "✅ Paper jar restored from cache"
          else
            if [ "$TARGET_VERSION" == "26.1.2" ]; then
              echo "✅ Cache miss. Downloading Paper 26.1.2..."
              wget -O server/paper.jar "https://fill-data.papermc.io/v1/objects/830d4eb5c15cbd802a9ec9f2f54eaaaeb9511958339aec983fd0c88bad21d940/paper-26.1.2-64.jar"
            else
              PROJECT_URL="https://api.papermc.io/v2/projects/paper"
              if curl -s $PROJECT_URL | jq -e ".versions | index(\"$TARGET_VERSION\")" > /dev/null; then
                VERSION="$TARGET_VERSION"
                echo "✅ Targeting version $VERSION"
              else
                VERSION=$(curl -s $PROJECT_URL | jq -r '.versions[-1]')
                echo "⚠️ Version $TARGET_VERSION not found. Falling back to latest: $VERSION"
              fi
              BUILD=$(curl -s $PROJECT_URL/versions/$VERSION | jq '.builds[-1]')
              wget -O server/paper.jar "$PROJECT_URL/versions/$VERSION/builds/$BUILD/downloads/paper-$VERSION-$BUILD.jar"
            fi
          fi
          
          if ls server/plugins/*.jar 1>/dev/null 2>&1; then
            echo "✅ Plugins restored from cache, skipping download"
          else
            mkdir -p server/plugins

            # --- Modrinth auto-download ---
            if [ -f "$GITHUB_WORKSPACE/plugins.txt" ]; then
              echo "📦 Downloading plugins from Modrinth..."
              while IFS= read -r raw_line || [ -n "$raw_line" ]; do
                line=$(echo "$raw_line" | xargs)
                [ -z "$line" ] && continue
                [[ "$line" == \#* ]] && continue

                echo "  ↪️ Fetching $line..."
                RESP=$(curl -s "https://api.modrinth.com/v2/project/$line/version")
                LATEST=$(echo "$RESP" | jq '[.[] | select(.version_type == "release")] | .[0]')
                if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
                  echo "  ⚠️ No release for $line, trying any version..."
                  LATEST=$(echo "$RESP" | jq '.[0]')
                fi
                if [ -z "$LATEST" ] || [ "$LATEST" = "null" ]; then
                  echo "  ❌ Invalid Modrinth ID: $line"
                  continue
                fi

                URL=$(echo "$LATEST" | jq -r '.files[0].url')
                FILENAME=$(echo "$LATEST" | jq -r '.files[0].filename')
                echo "  ⬇️ Downloading $FILENAME..."
                wget -q -O "server/plugins/$FILENAME" "$URL"
                echo "  ✅ $FILENAME"
              done < "$GITHUB_WORKSPACE/plugins.txt"
            fi

            # --- Repo plugins fallback ---
            if [ -d plugins ]; then
              echo "📦 Copying plugins from repo..."
              cp -r plugins/* server/plugins/
            fi
          fi

      # 5c. Save Cache (only on cache miss)
      - name: 💾 Save Paper Jar Cache
        if: steps.cache-paper.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: server/paper.jar
          key: paper-26.1.2-64

      - name: 💾 Save Plugins Cache
        if: steps.cache-plugins.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: server/plugins
          key: plugins-${{ hashFiles('plugins/**') }}-${{ hashFiles('plugins.txt') }}

      # 6. Configure Plugins (DiscordSRV & Bedrock Nether)
      # NOTE: All config steps are safe — missing jars or empty tokens will NOT crash the server.
      - name: 🔧 Configure Plugins
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
        run: |
          if ls server/plugins/DiscordSRV*.jar 1> /dev/null 2>&1; then
            mkdir -p server/plugins/DiscordSRV
            if [ -n "$DISCORD_TOKEN" ]; then
              echo "BotToken: \"$DISCORD_TOKEN\"" > server/plugins/DiscordSRV/config.yml
              echo "Channels: {\"global\": \"1479509091155054712\"}" >> server/plugins/DiscordSRV/config.yml
              echo "DiscordConsoleChannelId: \"1479518082295664730\"" >> server/plugins/DiscordSRV/config.yml
              echo "DiscordConsoleChannelLevels: [info]" >> server/plugins/DiscordSRV/config.yml
              echo "ConfigVersion: 1.26.0" >> server/plugins/DiscordSRV/config.yml
              echo "Experiment_JdbcAccountLinkBackend: true" >> server/plugins/DiscordSRV/config.yml
              echo "  ✅ DiscordSRV configured"
            else
              echo "  ⏭️ DiscordSRV jar found but DISCORD_TOKEN not set — skipping config. Server runs without Discord bridge."
            fi
          fi

          if ls server/plugins/Geyser-Spigot*.jar 1> /dev/null 2>&1; then
            mkdir -p server/plugins/Geyser-Spigot
            echo "above-bedrock-nether-building: true" > server/plugins/Geyser-Spigot/config.yml
            echo "max-build-height: 256" >> server/plugins/Geyser-Spigot/config.yml
            echo "cache-chunks: true" >> server/plugins/Geyser-Spigot/config.yml
            echo "forward-player-ping: true" >> server/plugins/Geyser-Spigot/config.yml
            echo "force-resource-packs: true" >> server/plugins/Geyser-Spigot/config.yml
          fi

          if [ -d server/plugins/UltimateTeams ]; then
            find server/plugins/UltimateTeams -name "*.yml" -type f -exec sed -i 's/"Not in a team"/""/g' {} +
          fi

      # 7. Start Server & Tunnel (Combined to prevent GitHub killing background processes)
      - name: 🟢 Start Server
        env:
          PLAYIT_SECRET: ${{ secrets.PLAYIT_SECRET }}
        run: |
          # 1. Start Playit INSIDE this step so it doesn't get killed
          echo "Starting Playit tunnel..."
          if [ -z "$PLAYIT_SECRET" ]; then
            echo ""
            echo "================================================================="
            echo "❌ ERROR: NO PLAYIT_SECRET FOUND!"
            echo "================================================================="
            echo "1. Go to https://playit.gg and create an account"
            echo "2. Download and run the Playit agent on your own computer first to claim it"
            echo "3. Go to Dashboard -> Agents -> Click your new agent"
            echo "4. Copy its Secret Key"
            echo "5. Add it to your GitHub Repository Secrets as PLAYIT_SECRET"
            echo "6. Run this workflow again!"
            echo "================================================================="
            echo ""
            exit 1
          else
            # Use 'script' to create a real PTY so Playit's TUI renderer doesn't crash
            nohup script -qefc "playit --secret $PLAYIT_SECRET" /dev/null > playit_log.txt 2>&1 &
            PLAYIT_PID=$!
            echo "Playit PID: $PLAYIT_PID"
            sleep 20
          fi
          
          # 2. Show Connection Info
          echo "------------------------------------------"
          echo "🚀 YOUR MINECRAFT SERVER IS ONLINE!"
          echo "------------------------------------------"
          JAVA_IP=$(grep -oE '[a-zA-Z0-9.-]+\.joinmc\.link' playit_log.txt | head -n 1)
          echo "🖥️ JAVA IP: ${JAVA_IP:-Check playit.gg dashboard}"
          BEDROCK_INFO=$(grep -oE '[a-zA-Z0-9.-]+\.ply\.gg:[0-9]+' playit_log.txt | head -n 1)
          if [ -z "$JAVA_IP" ] && [ -z "$PLAYIT_SECRET" ]; then
             echo "⚠️ SERVER HAS NO IP! YOU MUST CLICK THE CLAIM LINK ABOVE ⚠️"
          else
             echo "📱 BEDROCK: ${BEDROCK_INFO:-Check playit.gg dashboard}"
          fi
          echo "------------------------------------------"
          echo "🎮 Logs below are only from Minecraft..."
          
          cd server
          
          # 3. Start Minecraft Server (6GB RAM for best performance)
          java -Xms6G -Xmx6G -XX:+UseG1GC -XX:+ParallelRefProcEnabled -XX:MaxGCPauseMillis=200 -XX:+UnlockExperimentalVMOptions -XX:+DisableExplicitGC -XX:+AlwaysPreTouch -XX:G1NewSizePercent=30 -XX:G1MaxNewSizePercent=40 -XX:G1HeapRegionSize=8M -XX:G1ReservePercent=20 -XX:G1HeapWastePercent=5 -XX:G1MixedGCCountTarget=4 -XX:InitiatingHeapOccupancyPercent=15 -XX:G1MixedGCLiveThresholdPercent=90 -XX:G1OldCSetRegionThresholdPercent=5 -XX:SurvivorRatio=32 -XX:+PerfDisableSharedMem -XX:MaxTenuringThreshold=1 -Dusing.aikars.flags=https://mcflags.emc.gs -Daikars.new.flags=true -jar paper.jar nogui &
          SERVER_PID=$!
          
          # 2. Safety Timer Logic (With Warnings)
          START_TIME=$(date +%s)
          MAX_DURATION=19800 # 5.5 Hours
          
          # Flags to ensure we only warn once
          WARNED_30="false"
          WARNED_1="false"
          WARNED_COUNTDOWN="false"
          
          echo "⏳ Server started. Monitoring for 5.5 hours or manual stop..."
          
          while kill -0 $SERVER_PID 2>/dev/null; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))
            
            # --- WARNING 1: 30 Minutes Left (at 18000s) ---
            if [ $ELAPSED -ge 18000 ] && [ "$WARNED_30" == "false" ]; then
                echo "say ⚠️ NOTICE: Server will shutdown in 30 minutes!" > /proc/$SERVER_PID/fd/0
                WARNED_30="true"
            fi

            # --- WARNING 2: 1 Minute Left (at 19740s) ---
            if [ $ELAPSED -ge 19740 ] && [ "$WARNED_1" == "false" ]; then
                echo "say 🚨 URGENT: Server will shutdown in 1 MINUTE!" > /proc/$SERVER_PID/fd/0
                WARNED_1="true"
            fi

            # --- WARNING 3: 15s Countdown (at 19785s) ---
            if [ $ELAPSED -ge 19785 ] && [ "$WARNED_COUNTDOWN" == "false" ]; then
                WARNED_COUNTDOWN="true"
                echo "say 🚨 Countdown started..." > /proc/$SERVER_PID/fd/0
                for i in {15..1}; do
                   echo "say Server shutting down in $i..." > /proc/$SERVER_PID/fd/0
                   sleep 1
                done
                echo "say 👋 Server is closing now!" > /proc/$SERVER_PID/fd/0
            fi

            # If timer runs out (5.5 hours)
            if [ $ELAPSED -ge $MAX_DURATION ]; then
              echo "⏰ Time limit reached (5.5h). Initiating shutdown..."
              
              # Try Graceful Stop
              echo "stop" > /proc/$SERVER_PID/fd/0
              
              # Give it 60 seconds to save and close
              count=0
              while kill -0 $SERVER_PID 2>/dev/null && [ $count -lt 6 ]; do
                sleep 10
                count=$((count+1))
                echo "Waiting for save... ($((count*10))s)"
              done
              
              # If still running after 60s, FORCE KILL
              if kill -0 $SERVER_PID 2>/dev/null; then
                 echo "⚠️ Server stuck! Force killing to ensure backup..."
                 kill -9 $SERVER_PID
              fi
              break
            fi
            # Auto-restart Playit if it crashed (check every 60s)
            PLAYIT_CHECK=$((ELAPSED % 60))
            if [ "$PLAYIT_CHECK" -lt 11 ]; then
              if ! kill -0 $PLAYIT_PID 2>/dev/null; then
                echo "⚠️ Playit tunnel crashed! Here is the error log:"
                cat $GITHUB_WORKSPACE/playit_log.txt || echo "No log found."
                echo "Restarting Playit..."
                if [ -z "$PLAYIT_SECRET" ]; then
                   unset PLAYIT_SECRET
                   nohup script -qefc "playit" /dev/null > $GITHUB_WORKSPACE/playit_log.txt 2>&1 &
                else
                   nohup script -qefc "playit --secret $PLAYIT_SECRET" /dev/null > $GITHUB_WORKSPACE/playit_log.txt 2>&1 &
                fi
                PLAYIT_PID=$!
                sleep 20
              fi
            fi
            sleep 10
          done
          
          # 3. Final Cleanup
          wait $SERVER_PID || true
          echo "✅ Server process finished. Proceeding to backup..."

      # 8. Auto-Backup (Includes worlds, player data, and all plugin data like Ultimate Teams .yml files)
      - name: 📤 Backup to Hugging Face
        if: always()
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USER: ${{ secrets.HF_USER }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          cd server
          shopt -s nullglob
          # The 'plugins' folder is zipped recursively, safely backing up all plugin configs, .yml files, and databases!
          zip -r backup.zip minecraft-worlds plugins *.json *.yml -x "*.jar"
          hf upload "$HF_USER/$HF_DATASET" backup.zip backup.zip --repo-type dataset
          echo "✅ Backup Complete!"

      # 9. Auto-Restart Workflow
      - name: 🔄 Auto-Restart Server
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Triggering next workflow run to restart the server..."
          gh workflow run main.yml --ref ${{ github.ref_name }}
          echo "✅ Restart triggered successfully! Thanks for using @GamingBurst007's script!"

# --- End of Workflow ---
# Developed by @GamingBurst007 (Discord/Insta)
